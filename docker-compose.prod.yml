# Production Docker Compose (Oracle Cloud ARM Ampere A1, 4 OCPU + 24GB RAM)
# Next.js 는 Vercel 별도 배포. ARM 인스턴스에는 API 서버 + 의존 인프라
# (postgres/redis self-host) 만. 리소스 limit 은 팀 시점 t3.medium 기준을
# 그대로 보존 (총 ~2.5 OCPU / ~3.4GB) — ARM 24GB 안에서 여유 충분.
# 필요 시 v2.0 PR-3 단계에서 ARM 풀스펙(4 OCPU / 24GB)에 맞춰 상향 조정.
#
# 보안: backend 네트워크는 internal=true 로 인터넷 차단. postgres/redis 는
# 호스트 포트 매핑 없음 — Docker 내부 전용. 외부 노출은 caddy/nginx 80/443 만.

services:
  # PostgreSQL + pgvector — 내부 전용, 인터넷 차단.
  # 127.0.0.1 바인딩으로 ARM 인스턴스 외부에선 접근 불가, 호스트 SSH 터널(DBeaver)만 허용.
  # 공식 pgvector image (PG15 + pgvector 0.7+) — multi-arch (linux/amd64 + linux/arm64)
  # 지원, ARM Ampere A1 에서 native 동작. RAG 임베딩 검색의 vector 컬럼 필수.
  # 마이그레이션 #8 의 ``CREATE EXTENSION vector`` 가 통과하려면 base image 에 extension 이 포함돼야 함.
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-doseph_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-doseph_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doseph_admin} -d ${DB_NAME:-doseph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Redis — 내부 전용, 인터넷 차단. (v2.0: Upstash 가정 폐기 → ARM self-host 확정)
  # 127.0.0.1 바인딩으로 ARM 외부 접근 차단, 호스트에서는 redis-cli 로 점검 가능.
  # RQ broker — idle 시에도 분당 60+ BRPOP polling 발생 (~ 일 86K command).
  # Upstash free tier (10K cmd/day) 로는 절대 부족, self-host 가 유일 옵션.
  redis:
    image: redis:alpine
    container_name: redis
    # 60 초마다 서버측 TCP keepalive PING — NAT idle drop 예방.
    # 클라이언트 ``socket_keepalive`` + ``health_check_interval`` 와 양방향 보호.
    command: ["redis-server", "--tcp-keepalive", "60"]
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI API 서버 — ML 추론은 ai-worker 에 위임
  fastapi:
    container_name: fastapi
    image: ghcr.io/kimyeongbin-dev/doseph-fastapi:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: app/Dockerfile.prod
    env_file:
      - .env
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
      - ./logs/fastapi:/app/logs
    environment:
      LOG_DIR: /app/logs
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # AI Worker — ko-sroberta 상주 + PyTorch CPU + OpenAI async + 병렬 버퍼
  # 피크 메모리 약 1.8GB. 팀 시점 t3.medium 2GB 한도 그대로 보존 — ARM 24GB 안에선 여유.
  # ARM wheel: torch CPU + sentence-transformers 모두 PyPI 에 linux/arm64 휠 제공
  # (torch 2.x+, sentence-transformers 2.x+) — 빌드 시 추가 컴파일 불필요.
  ai-worker:
    container_name: ai-worker
    image: ghcr.io/kimyeongbin-dev/doseph-ai-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: ai_worker/Dockerfile.prod
    env_file:
      - .env
    volumes:
      - ./logs/ai-worker:/app/logs
    environment:
      LOG_DIR: /app/logs
    networks:
      - frontend  # OpenAI / Kakao Local / CLOVA OCR 외부 호출
      - backend   # Redis
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.from_url('redis://redis:6379/0'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Nginx — HTTPS 리버스 프록시, Let's Encrypt 인증서
  nginx:
    container_name: nginx
    image: nginx:alpine
    volumes:
      - ./nginx/prod_https.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      fastapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
    name: postgres_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume

networks:
  # 외부 통신 가능 — 인바운드(nginx 80/443) + 아웃바운드(fastapi·ai-worker 외부 API)
  frontend:
    name: frontend
    driver: bridge
  # 내부 전용 — postgres/redis 의 인터넷 egress 차단. 해킹 당해도 C&C 통신 불가.
  # fastapi/ai-worker 는 frontend 네트워크도 속해 있어 외부 API 호출 가능.
  backend:
    name: backend
    driver: bridge
    internal: true
